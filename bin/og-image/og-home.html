<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
	Fuente de la imagen para compartir la portada (1200 × 630). Se fotografía con
	bin/og-image/render.ps1 y el resultado va a themes/camisama/assets/images/og-home.png.
	Usa las fuentes y prendas del tema para que coincida con la web.
-->
<style>
@font-face {
	font-family: "Bricolage Grotesque";
	src: url("../../themes/camisama/assets/fonts/bricolage-grotesque/bricolage-grotesque-latin-wght-normal.woff2") format("woff2");
	font-weight: 200 800;
}

@font-face {
	font-family: Inter;
	src: url("../../themes/camisama/assets/fonts/inter/inter-latin-wght-normal.woff2") format("woff2");
	font-weight: 100 900;
}

html,
body {
	width: 1200px;
	height: 630px;
	margin: 0;
	overflow: hidden;
}

body {
	position: relative;
	background: #F7F4EE;
	color: #16161A;
	font-family: Inter, sans-serif;
}

.copy {
	position: absolute;
	top: 64px;
	left: 72px;
	width: 600px;
}

.brand {
	display: flex;
	align-items: center;
	gap: 16px;
	font-family: "Bricolage Grotesque", sans-serif;
	font-size: 34px;
	font-weight: 800;
	letter-spacing: -0.03em;
}

.brand img {
	width: 56px;
	height: 56px;
}

h1 {
	margin: 52px 0 26px;
	font-family: "Bricolage Grotesque", sans-serif;
	font-size: 120px;
	font-weight: 700;
	line-height: 0.95;
	letter-spacing: -0.035em;
}

.lead {
	margin: 0;
	font-size: 32px;
	font-weight: 600;
	line-height: 1.3;
}

.note {
	margin: 14px 0 0;
	color: #5F5E66;
	font-size: 24px;
}

.card {
	position: absolute;
	top: 75px;
	right: 72px;
	width: 440px;
	height: 440px;
	overflow: hidden;
	border-radius: 32px;
	background: #E9E4DA;
}

.card img.base {
	width: 100%;
	height: 100%;
}

/* El frente de la plantilla del editor (bin/plantillas/zonas.json). */
.zone {
	position: absolute;
	top: 19.8%;
	left: 34.25%;
	box-sizing: border-box;
	width: 31.2%;
	height: 41.6%;
	border: 2px dashed rgb(255 255 255 / 0.85);
	border-radius: 4px;
	box-shadow: 0 0 0 1px rgb(22 22 26 / 0.35), inset 0 0 0 1px rgb(22 22 26 / 0.35);
}

.zone .text {
	display: block;
	margin-top: 6%;
	color: #F7F4EE;
	font-family: "Bricolage Grotesque", sans-serif;
	font-size: 25px;
	font-weight: 800;
	line-height: 0.95;
	text-align: center;
}

.zone img {
	display: block;
	width: 34%;
	margin: 8% auto 0;
}

.seal {
	position: absolute;
	top: 22px;
	right: 28px;
	width: 150px;
	height: 150px;
	transform: rotate(-18deg);
}

.seal .ring {
	width: 100%;
	height: 100%;
}

.seal .mark {
	position: absolute;
	inset: 31%;
	box-sizing: border-box;
	padding: 7%;
	border-radius: 50%;
	background: #16161A;
	fill: #F7F4EE;
}

.seal .mark rect {
	fill: #D3261C;
}

.bar {
	position: absolute;
	right: 0;
	bottom: 0;
	left: 0;
	height: 16px;
	background: #D3261C;
}
</style>
</head>
<body>
<div class="copy">
	<div class="brand"><img src="../../themes/camisama/assets/images/logo-mark.svg" alt="">Camisama</div>
	<h1>Tu diseño,<br>tu ley.</h1>
	<p class="lead">Camisetas personalizadas,<br>desde una unidad.</p>
	<p class="note">Estampadas en DTF · Entrega en Lima y Callao</p>
</div>
<div class="card">
	<img class="base" src="../../themes/camisama/assets/images/example-tee-black.webp" alt="">
	<div class="zone"><img src="../../themes/camisama/assets/images/example-sun.svg" alt=""><span class="text">A MI<br>MANERA.</span></div>
</div>
<div class="seal">
	<svg class="ring" viewBox="0 0 120 120"><defs><path id="p" d="M60 60m-45 0a45 45 0 1 1 90 0a45 45 0 1 1-90 0"/></defs><circle cx="60" cy="60" r="59" fill="#F5B700"/><text fill="#16161A" font-family="Inter" font-size="12.5" font-weight="700" textLength="282" lengthAdjust="spacing"><textPath href="#p">DESDE 1 UNIDAD ✦ ESTAMPADO EN PERÚ ✦</textPath></text></svg>
	<svg class="mark" viewBox="0 0 48 48"><path d="M18 11Q24 16 30 11L38 14L42 21L36 23.5V37H12V23.5L6 21L10 14Z"/><rect x="26.5" y="20" width="5" height="5" rx="1"/></svg>
</div>
<div class="bar"></div>
</body>
</html>
