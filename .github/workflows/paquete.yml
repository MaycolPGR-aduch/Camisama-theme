name: Paquetes

# Tema, plugin y carga para instalar la tienda en un servidor (bin/produccion/LEEME.md). Se crean al
# etiquetar una versión (git tag v0.3.0 && git push --tags) o a mano desde Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paquetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Compilar
        run: |
          npm ci
          npm run build

      - name: Dependencias del plugin
        run: composer install --no-dev --optimize-autoloader --no-interaction --working-dir=plugins/camisama-customizer

      - name: Empaquetar
        run: python3 bin/paquete.py "${GITHUB_REF_NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: camisama-${{ github.ref_name }}
          path: dist/*.zip

      - name: Publicar la versión
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
